# Packages for every release: pushing a tag v* builds undershell for Debian 13,
# Ubuntu 24.04, Fedora 43 and 44 and Arch Linux, each in a container of its own
# (packaging/build-release.sh), and publishes them on the tag's GitHub Release
# with their SHA-256 sums. "Run workflow" builds them without publishing (they
# stay as the run's artifacts). Actions are pinned to commits (the tag in the
# comment); only the publishing job may write to the repository.
name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# the builds only read; publishing (the last job) is the only one that writes
permissions:
  contents: read

jobs:
  # a tag v1.2.3 must match the version the source says (meson.build), or
  # the packages would carry the old number
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: The tag and the source agree
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          src=$(sed -n "s/^  version : '\(.*\)',$/\1/p" meson.build)
          echo "tag $TAG, meson.build $src"
          [ "v$src" = "$TAG" ] || { echo "::error::the tag is $TAG but meson.build says $src: bump the version first"; exit 1; }

  build:
    needs: version
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: debian-13, image: 'debian:13', tools: 'apt-get update -q && apt-get install -y -q git ca-certificates' }
          - { target: ubuntu-24.04, image: 'ubuntu:24.04', tools: 'apt-get update -q && apt-get install -y -q git ca-certificates' }
          - { target: fedora-43, image: 'fedora:43', tools: 'dnf -y -q install git' }
          - { target: fedora-44, image: 'fedora:44', tools: 'dnf -y -q install git' }
          - { target: arch, image: 'archlinux:latest', tools: 'pacman -Syu --noconfirm --needed git' }
    steps:
      # git first, so the checkout is a repository (the build counts its commits)
      - name: Install git
        run: ${{ matrix.tools }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the package
        run: packaging/build-release.sh ${{ matrix.target }} "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: undershell-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          name: undershell ${{ github.ref_name }}
          body_path: packaging/release-notes.md
          generate_release_notes: true
          files: packages/*
