# Packages for every release: pushing a tag v* builds undershell for Debian 13,
# Ubuntu 24.04, Fedora 43 and 44, Arch Linux, NixOS and Void Linux, and
# publishes them on the tag's GitHub Release
# with their SHA-256 sums. "Run workflow" builds them without publishing (they
# stay as the run's artifacts). Actions are pinned to commits (the tag in the
# comment); only the publishing job may write to the repository.
name: Release packages

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      nixos_void_only:
        description: Build only NixOS and Void packages
        type: boolean
        default: false

# the builds only read; publishing (the last job) is the only one that writes
permissions:
  contents: read

jobs:
  # a tag v1.2.3 must match the version the source says (meson.build), or
  # the packages would carry the old number
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - name: The tag and the source agree
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ github.ref_name }}
        run: |
          src=$(sed -n "s/^  version : '\(.*\)',$/\1/p" meson.build)
          echo "tag $TAG, meson.build $src"
          [ "v$src" = "$TAG" ] || { echo "::error::the tag is $TAG but meson.build says $src: bump the version first"; exit 1; }

  build:
    needs: version
    if: ${{ !inputs.nixos_void_only }}
    name: ${{ matrix.target }}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: debian-13, image: 'debian:13', tools: 'apt-get update -q && apt-get install -y -q git ca-certificates' }
          - { target: ubuntu-24.04, image: 'ubuntu:24.04', tools: 'apt-get update -q && apt-get install -y -q git ca-certificates' }
          - { target: fedora-43, image: 'fedora:43', tools: 'dnf -y -q install git' }
          - { target: fedora-44, image: 'fedora:44', tools: 'dnf -y -q install git' }
          - { target: arch, image: 'archlinux:latest', tools: 'pacman -Syu --noconfirm --needed git' }
    steps:
      # git first, so the checkout is a repository (the build counts its commits)
      - name: Install git
        run: ${{ matrix.tools }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Build the package
        run: packaging/build-release.sh ${{ matrix.target }} "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: undershell-${{ matrix.target }}
          path: out/*
          if-no-files-found: error

  nixos:
    needs: version
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b  # v31.11.3
      - name: Build and verify the Nix runtime closure
        run: bash packaging/nix/build-closure.sh "$GITHUB_WORKSPACE/out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: undershell-nixos
          path: out/*
          if-no-files-found: error

  void:
    needs: version
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        libc: [glibc, musl]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      # The Actions runner and artifact uploader run on glibc even when
      # the build container uses musl.
      - name: Build and install the XBPS package
        env:
          VOID_LIBC: ${{ matrix.libc }}
        run: |
          mkdir -p "$GITHUB_WORKSPACE/out"
          docker run --rm --mount "type=bind,source=$GITHUB_WORKSPACE,target=/src,readonly" \
            --mount "type=bind,source=$GITHUB_WORKSPACE/out,target=/out" \
            "ghcr.io/void-linux/void-$VOID_LIBC-full:latest" sh -ec '
              xbps-install -Syu
              xbps-install -y git bash
              git config --global --add safe.directory /src
              bash /src/packaging/void/build-xbps.sh /out
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: undershell-void-${{ matrix.libc }}
          path: out/*.xbps
          if-no-files-found: error

  release:
    needs: [build, nixos, void]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          path: packages
          merge-multiple: true
      - name: Checksums
        run: cd packages && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2.6.2
        with:
          name: undershell ${{ github.ref_name }}
          body_path: packaging/release-notes.md
          generate_release_notes: true
          files: packages/*
